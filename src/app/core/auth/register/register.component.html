<div class="min-h-screen grid grid-cols-1 lg:grid-cols-2">
  <div class="hidden lg:block lg:sticky lg:top-0 lg:h-screen">
    <app-left-content />
  </div>

  <section class="flex min-h-screen items-center justify-center bg-white px-6 py-12 sm:px-16">
    <div class="w-full max-w-md">
      <h2 class="mb-10 text-[30px] font-bold text-slate-800">Create Account</h2>

      <form [formGroup]="registerForm" (ngSubmit)="submitForm()">
        <!-- Username -->
        <div class="mb-5">
          <app-input
            [control]="registerForm.get('username')"
            [typeInput]="'text'"
            [idInput]="'username'"
            [labelInput]="'username'"
          />
        </div>
        <!-- Firstname -->
        <div class="mb-5">
          <app-input
            [control]="registerForm.get('firstName')"
            [typeInput]="'text'"
            [idInput]="'firstName'"
            [labelInput]="'Firstname'"
          />
        </div>
        <!-- Lastname -->
        <div class="mb-5">
          <app-input
            [control]="registerForm.get('lastName')"
            [typeInput]="'text'"
            [idInput]="'lastName'"
            [labelInput]="'Lastname'"
          />
        </div>
        <!-- Email -->
        <div class="mb-5">
          <app-input
            [control]="registerForm.get('email')"
            [typeInput]="'email'"
            [idInput]="'email'"
            [labelInput]="'email'"
          />
        </div>
        <!-- Password -->
        <div class="mb-5">
          <app-input
            [control]="registerForm.get('password')"
            [idInput]="'password'"
            [labelInput]="'password'"
          >
            Min. 8 characters, including uppercase, lowercase, number, and special character.
          </app-input>
        </div>
        <!-- Repassword -->
        <div class="mb-5">
          <app-input
            [control]="registerForm.get('rePassword')"
            [idInput]="'rePassword'"
            [labelInput]="'RePassword'"
          />
        </div>
        <!-- Phone -->
        <div class="mb-5">
          <app-input
            [control]="registerForm.get('phone')"
            [typeInput]="'tel'"
            [idInput]="'phone'"
            [labelInput]="'Phone'"
          >
            Enter a valid Egyptian mobile number.
          </app-input>
        </div>

        <!-- Forgot Password -->
        <div class="mb-10 flex justify-center">
          <a class="text-sm font-semibold text-gray-400 text-center">
            already have an account?
            <span routerLink="/login" class="text-blue-500 transition hover:text-blue-700"
              >Login</span
            >
          </a>
        </div>

        <!-- Login Button -->
        <button [disabled]="isLoading()" type="submit" class="btn">
          Register
          @if (isLoading()) {
            <span> <i class="fas fa-spinner animate-spin"></i></span>
          }
        </button>
        @if (msgError()) {
          <p class="text-center text-red-500 mt-4 p-4 bg-red-200">{{ msgError() }}</p>
        }
      </form>
    </div>
  </section>
</div>
