<div
  class="min-h-screen bg-[#F8FAFC] flex items-center justify-center px-6 py-12 overflow-hidden relative"
>
  <!-- Background Decoration -->
  <div class="absolute top-0 right-0 w-80 h-80 bg-indigo-50 rounded-full blur-3xl opacity-70"></div>
  <div
    class="absolute bottom-0 left-0 w-72 h-72 bg-violet-50 rounded-full blur-3xl opacity-70"
  ></div>

  <div
    class="relative z-10 max-w-6xl w-full bg-white rounded-3xl border border-slate-100 shadow-sm p-8 sm:p-12 lg:p-16"
  >
    <div class="grid grid-cols-1 lg:grid-cols-2 items-center gap-12">
      <!-- Illustration -->
      <div class="flex justify-center items-center order-2 lg:order-1">
        <div class="relative w-full max-w-md">
          <!-- Background Circle -->
          <div class="absolute inset-8 bg-indigo-50 rounded-full"></div>

          <svg
            viewBox="0 0 480 400"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            class="relative w-full"
          >
            <!-- Shadow -->
            <ellipse cx="240" cy="350" rx="175" ry="22" fill="#E2E8F0" />

            <!-- Laptop Screen -->
            <rect x="95" y="70" width="290" height="205" rx="18" fill="#1E293B" />
            <rect x="108" y="83" width="264" height="179" rx="10" fill="#FFFFFF" />

            <!-- Screen content -->
            <rect x="130" y="105" width="55" height="8" rx="4" fill="#CBD5E1" />
            <rect x="130" y="122" width="95" height="7" rx="4" fill="#E2E8F0" />

            <text
              x="240"
              y="190"
              text-anchor="middle"
              fill="#4F46E5"
              font-size="66"
              font-weight="700"
              font-family="Arial"
            >
              404
            </text>

            <text
              x="240"
              y="215"
              text-anchor="middle"
              fill="#64748B"
              font-size="13"
              font-family="Arial"
            >
              PAGE NOT FOUND
            </text>

            <!-- Screen bottom line -->
            <rect x="190" y="235" width="100" height="6" rx="3" fill="#E2E8F0" />

            <!-- Laptop Base -->
            <path d="M75 276 H405 L430 295 Q433 301 421 303 H59 Q47 301 52 295 Z" fill="#CBD5E1" />
            <path d="M175 279 H305 L294 290 H186 Z" fill="#94A3B8" />

            <!-- Document -->
            <rect
              x="48"
              y="185"
              width="105"
              height="145"
              rx="10"
              fill="#FFFFFF"
              stroke="#E2E8F0"
              stroke-width="2"
              transform="rotate(-10 48 185)"
            />

            <g transform="rotate(-10 48 185)">
              <rect x="66" y="210" width="55" height="6" rx="3" fill="#C7D2FE" />
              <rect x="66" y="226" width="70" height="5" rx="2.5" fill="#E2E8F0" />

              <circle cx="75" cy="250" r="6" stroke="#A5B4FC" stroke-width="2" />
              <rect x="88" y="247" width="40" height="5" rx="2.5" fill="#E2E8F0" />

              <circle cx="75" cy="270" r="6" stroke="#A5B4FC" stroke-width="2" />
              <rect x="88" y="267" width="40" height="5" rx="2.5" fill="#E2E8F0" />

              <circle cx="75" cy="290" r="6" stroke="#A5B4FC" stroke-width="2" />
              <rect x="88" y="287" width="40" height="5" rx="2.5" fill="#E2E8F0" />
            </g>

            <!-- Graduation cap -->
            <path d="M300 65 L365 38 L430 65 L365 92 Z" fill="#4F46E5" />
            <path d="M330 77 V98 Q365 120 400 98 V77" fill="#6366F1" />
            <path d="M430 65 V105" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
            <circle cx="430" cy="108" r="6" fill="#F59E0B" />

            <!-- Decorative question mark -->
            <circle cx="80" cy="95" r="30" fill="#EEF2FF" />
            <text
              x="80"
              y="108"
              text-anchor="middle"
              fill="#818CF8"
              font-size="42"
              font-weight="600"
              font-family="Arial"
            >
              ?
            </text>

            <!-- Plant -->
            <path
              d="M400 320 Q400 285 390 265"
              stroke="#94A3B8"
              stroke-width="4"
              stroke-linecap="round"
            />
            <path d="M394 290 Q365 270 360 290 Q375 310 394 290Z" fill="#A5B4FC" />
            <path d="M398 278 Q425 250 440 268 Q430 285 398 278Z" fill="#818CF8" />
            <path
              d="M400 320 Q400 290 415 275"
              stroke="#94A3B8"
              stroke-width="4"
              stroke-linecap="round"
            />
            <path d="M408 300 Q435 280 448 298 Q430 315 408 300Z" fill="#C4B5FD" />
          </svg>
        </div>
      </div>

      <!-- Text Content -->
      <div class="text-center lg:text-left order-1 lg:order-2">
        <!-- Small Label -->
        <span
          class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-50 text-indigo-600 rounded-full text-sm font-semibold mb-6"
        >
          <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
          Error 404
        </span>

        <h1 class="text-4xl sm:text-5xl font-bold text-slate-800 leading-tight mb-5">
          Page not
          <span class="text-indigo-600"> found.</span>
        </h1>

        <p class="text-slate-500 text-base sm:text-lg leading-8 max-w-md mx-auto lg:mx-0 mb-8">
          The page you're trying to access doesn't exist or may have been moved. Let's get you back
          to your exams.
        </p>

        <!-- Home Button -->
        <a
          routerLink="/home"
          class="inline-flex items-center cursor-pointer justify-center gap-3 px-7 py-3.5 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition-all duration-300 shadow-lg shadow-indigo-100 hover:shadow-indigo-200 hover:-translate-y-0.5"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="m3 10 9-7 9 7" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 9v12h14V9M9 21v-6h6v6" />
          </svg>

          Back to Home
        </a>

        <!-- Footer -->
        <div
          class="mt-10 flex items-center justify-center lg:justify-start gap-3 text-slate-400 text-sm"
        >
          <span class="w-8 h-px bg-slate-200"></span>
          <span>Online Examination System</span>
        </div>
      </div>
    </div>
  </div>
</div>
